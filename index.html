    /**
     * Индекс сегодняшнего дня недели: 0 (Пн) .. 6 (Вс)
     */
    function getTodayIndex() {
      const jsDay = new Date().getDay();
      return jsDay === 0 ? 6 : jsDay - 1;
    }

    /**
     * Возвращает объект Date для дня текущей недели (0..6)
     */
    function getDateForDayIndex(dayIndex) {
      const now = new Date();
      const diff = dayIndex - getTodayIndex();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate() + diff);
    }

    function formatShortDate(dateObj) {
      return dateObj.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
    }

    function formatDotDate(dateObj) {
      const d = String(dateObj.getDate()).padStart(2, '0');
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      return `${d}.${m}`;
    }

    /**
     * Безопасная работа с localStorage
     */
    function loadFromStorage(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function saveToStorage(key, data) {
      try {
        localStorage.setItem(key, JSON.stringify(data));
      } catch (e) {
        // Игнорируем ограничения приватного режима
      }
    }

     * Создает чистое состояние недели
     */
    function createInitialWeekState() {
      const state = {};
      WORKOUT_PLAN.forEach((day) => {
        if (day.isRestDay) {
          state[day.key] = { restDone: false };
        } else {
          const exercisesState = {};
          day.exercises.forEach((ex) => {
            exercisesState[ex.id] = Array.from({ length: ex.setsCount }, () => ({
              done: false,
              value: ex.target,
            }));
          });
          state[day.key] = { exercises: exercisesState };
        }
      });
      return state;
    }

    /**
     * Валидация сохраненного состояния на случай неполных данных
     */
    function ensureValidWeekState(loaded) {
      const base = createInitialWeekState();
      if (!loaded || typeof loaded !== 'object') return base;
      WORKOUT_PLAN.forEach((day) => {
        if (day.isRestDay) {
          if (loaded[day.key] && typeof loaded[day.key].restDone === 'boolean') {
            base[day.key].restDone = loaded[day.key].restDone;
          }
        } else if (loaded[day.key] && loaded[day.key].exercises) {
          day.exercises.forEach((ex) => {
            const savedSets = loaded[day.key].exercises[ex.id];
            if (Array.isArray(savedSets) && savedSets.length > 0) {
              base[day.key].exercises[ex.id] = savedSets.map((s) => ({
                done: Boolean(s.done),
                value: Number.isFinite(Number(s.value)) ? Number(s.value) : ex.target,
              }));
            }
          });
        }
      });
      return base;
    }

    // Состояние приложения
    let weekState = ensureValidWeekState(loadFromStorage(STORAGE_KEY_WEEK, null));
    let selectedDayIndex = getTodayIndex();
    let editingTarget = null; // { dayKey, ex, setIdx }

    // DOM-элементы
    const elHeaderDate = document.getElementById('header-date');
    const elDaySelector = document.getElementById('day-selector');
    const elDayTitle = document.getElementById('day-title');
    const elDaySubtitle = document.getElementById('day-subtitle');
    const elDayTodayBadge = document.getElementById('day-today-badge');
    const elDayDateLabel = document.getElementById('day-date-label');
    const elExercisesContainer = document.getElementById('exercises-container');
    const elStatPullups = document.getElementById('stat-pullups');
    const elStatDips = document.getElementById('stat-dips');
    const elStatDays = document.getElementById('stat-days');
    const elResetWeekZone = document.getElementById('reset-week-zone');

    // Модалка редактирования подхода
    const elSetModal = document.getElementById('set-modal');
    const elModalExName = document.getElementById('modal-ex-name');
    const elModalSetLabel = document.getElementById('modal-set-label');
    const elModalValueInput = document.getElementById('modal-value-input');
    const elModalUnitLabel = document.getElementById('modal-unit-label');

    // Модалка экспорта
    const elExportModal = document.getElementById('export-modal');
    const elExportTextarea = document.getElementById('export-textarea');
    const elExportCopyLabel = document.getElementById('export-copy-label');

    /**
     * ============================================================
     * ТЕМА (СВЕТЛАЯ / ТЕМНАЯ)
     * ============================================================
     */
    function initTheme() {
      const saved = loadFromStorage(STORAGE_KEY_THEME, null);
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }

    document.getElementById('theme-toggle').addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      saveToStorage(STORAGE_KEY_THEME, isDark ? 'dark' : 'light');
    });

    /**
     * ============================================================
     * ТОСТ-УВЕДОМЛЕНИЕ
     * ============================================================
     */
    let toastTimer = null;
    function showToast(message) {
      const elToast = document.getElementById('toast');
      document.getElementById('toast-text').textContent = message;
      elToast.classList.remove('opacity-0', 'translate-y-2');
      elToast.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        elToast.classList.add('opacity-0', 'translate-y-2');
        elToast.classList.remove('opacity-100', 'translate-y-0');
      }, 2200);
    }

    /**
     * ============================================================
     * СТАТУСЫ И ПОДСЧЕТЫ
     * ============================================================
     */
    function getDayStatus(day) {
      const data = weekState[day.key];
      if (day.isRestDay) {
        return data.restDone ? 'done' : 'empty';
      }
      let total = 0;
      let done = 0;
      day.exercises.forEach((ex) => {
        const sets = data.exercises[ex.id] || [];
        total += sets.length;
        done += sets.filter((s) => s.done).length;
      });
      if (done === 0) return 'empty';
      if (done >= total) return 'done';
      return 'partial';
    }

    function calculateWeeklyTotals() {
      let pullups = 0;
      let dips = 0;
      let closedDays = 0;

      WORKOUT_PLAN.forEach((day) => {
        const status = getDayStatus(day);
        if (status === 'done') closedDays += 1;

        if (!day.isRestDay) {
          day.exercises.forEach((ex) => {
            const sets = weekState[day.key].exercises[ex.id] || [];
            const sum = sets
              .filter((s) => s.done)
              .reduce((acc, s) => acc + (Number(s.value) || 0), 0);
            if (ex.category === 'pullups') pullups += sum;
            if (ex.category === 'dips') dips += sum;
          });
        }
      });

      return { pullups, dips, closedDays };
    }

    function updateWeeklyStats() {
      const { pullups, dips, closedDays } = calculateWeeklyTotals();
      elStatPullups.textContent = pullups;
      elStatDips.textContent = dips;
      elStatDays.textContent = `${closedDays} / 7`;
    }

    /**
     * ============================================================
     * РЕНДЕР ПАНЕЛИ ДНЕЙ НЕДЕЛИ
     * ============================================================
     */
    function renderDaySelector() {
      const todayIdx = getTodayIndex();
      elDaySelector.innerHTML = '';

      WORKOUT_PLAN.forEach((day, idx) => {
        const isSelected = idx === selectedDayIndex;
        const isToday = idx === todayIdx;
        const status = getDayStatus(day);

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `flex flex-col items-center justify-center py-2.5 rounded-2xl border text-xs font-medium transition-all active:scale-95 ${
          isSelected
            ? 'bg-zinc-900 text-white border-zinc-900 dark:bg-zinc-100 dark:text-zinc-900 dark:border-zinc-100 shadow-sm'
            : 'bg-white dark:bg-zinc-900 text-zinc-600 dark:text-zinc-300 border-zinc-200 dark:border-zinc-800 hover:border-zinc-400 dark:hover:border-zinc-600'
        }`;

        // Индикатор выполнения под названием дня
        let indicator = '';
        if (status === 'done') {
          indicator = `<span class="w-1.5 h-1.5 rounded-full mt-1.5 bg-emerald-500"></span>`;
        } else if (status === 'partial') {
          indicator = `<span class="w-1.5 h-1.5 rounded-full mt-1.5 border border-emerald-500"></span>`;
        } else if (isToday) {
          indicator = `<span class="w-1.5 h-1.5 rounded-full mt-1.5 ${
            isSelected ? 'bg-white/50 dark:bg-zinc-900/40' : 'bg-zinc-300 dark:bg-zinc-600'
          }"></span>`;
        } else {
          indicator = `<span class="w-1.5 h-1.5 rounded-full mt-1.5 bg-transparent"></span>`;
        }

        btn.innerHTML = `
          <span>${day.short}</span>
          ${indicator}
        `;

        btn.addEventListener('click', () => {
          selectedDayIndex = idx;
          renderAll();
        });

        elDaySelector.appendChild(btn);
      });
    }

    /**
     * ============================================================
     * РЕНДЕР УПРАЖНЕНИЙ ВЫБРАННОГО ДНЯ
     * ============================================================
     */
    function renderExercises() {
      const dayPlan = WORKOUT_PLAN[selectedDayIndex];
      const dayData = weekState[dayPlan.key];
      const todayIdx = getTodayIndex();
      const targetDate = getDateForDayIndex(selectedDayIndex);

      elDayTitle.textContent = dayPlan.full;
      elDaySubtitle.textContent = dayPlan.focus;
      elDayTodayBadge.classList.toggle('hidden', selectedDayIndex !== todayIdx);
      elDayDateLabel.textContent = formatShortDate(targetDate);

      elExercisesContainer.innerHTML = '';

      // Особый экран для воскресенья (День отдыха)
      if (dayPlan.isRestDay) {
        const restCard = document.createElement('article');
        restCard.className = 'rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 p-6 text-center space-y-4';
        restCard.innerHTML = `
          <div class="w-11 h-11 mx-auto rounded-2xl bg-zinc-100 dark:bg-zinc-800 flex items-center justify-center text-zinc-500 dark:text-zinc-300">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
            </svg>
          </div>
          <div>
            <h3 class="text-sm font-semibold">Полный отдых</h3>
            <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-1 max-w-xs mx-auto leading-relaxed">
              Сон, еда и восстановление связок. Никаких подходов на турнике и брусьях.
            </p>
          </div>
          <button
            id="rest-toggle-btn"
            type="button"
            class="w-full py-2.5 px-4 rounded-xl border text-xs font-medium flex items-center justify-center gap-2 active:scale-[0.98] transition-all ${
              dayData.restDone
                ? 'bg-emerald-500/10 border-emerald-500/40 text-emerald-700 dark:text-emerald-300'
                : 'bg-zinc-50 dark:bg-zinc-950 border-zinc-200 dark:border-zinc-800 text-zinc-700 dark:text-zinc-300 hover:border-zinc-400'
            }"
          >
            <svg class="w-4 h-4 ${dayData.restDone ? 'text-emerald-500' : 'text-zinc-400'}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
            <span>${dayData.restDone ? 'День отдыха засчитан' : 'Отметить день отдыха'}</span>
          </button>
        `;

        restCard.querySelector('#rest-toggle-btn').addEventListener('click', () => {
          dayData.restDone = !dayData.restDone;
          saveToStorage(STORAGE_KEY_WEEK, weekState);
          renderAll();
        });

        elExercisesContainer.appendChild(restCard);
        return;
      }

      // Обычные тренировочные дни
      dayPlan.exercises.forEach((ex) => {
        const sets = dayData.exercises[ex.id] || [];
        const completedSets = sets.filter((s) => s.done);
        const totalSum = completedSets.reduce((acc, s) => acc + (Number(s.value) || 0), 0);

        const card = document.createElement('article');
        card.className = 'rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 p-4';

        // Верхняя часть карточки: название, описание, сумма и явный бейдж перерыва
        card.innerHTML = `
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <h3 class="text-sm font-semibold leading-snug">${ex.name}</h3>
              <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-0.5">${ex.detail}</p>
            </div>
            <div class="text-right shrink-0">
              <div class="text-sm font-semibold tabular-nums ${
                totalSum > 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-zinc-400 dark:text-zinc-500'
              }">
                ${totalSum}${ex.unit ? `<span class="text-xs font-normal ml-0.5">${ex.unit}</span>` : ''}
              </div>
              <div class="text-[10px] text-zinc-400 dark:text-zinc-500 tabular-nums">
                ${completedSets.length}/${sets.length}
              </div>
            </div>
          </div>

          <!-- Явный бейдж перерыва между подходами -->
          <div class="mt-2.5 inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-zinc-100 dark:bg-zinc-800/90 text-[11px] font-medium text-zinc-600 dark:text-zinc-300">
            <svg class="w-3.5 h-3.5 text-zinc-400 dark:text-zinc-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="9" />
              <path stroke-linecap="round" d="M12 7v5l3 2" />
            </svg>
            <span>${ex.rest}</span>
          </div>
        `;

        // Сетка ячеек подходов
        const setsWrap = document.createElement('div');
        setsWrap.className = 'flex flex-wrap items-center gap-2 mt-3.5';

        sets.forEach((setObj, sIdx) => {
          const cell = document.createElement('button');
          cell.type = 'button';
          cell.setAttribute(
            'aria-label',
            `${ex.name}, подход ${sIdx + 1}: ${setObj.value}${ex.unit}${setObj.done ? ', выполнено' : ''}`
          );

          const displayVal = `${setObj.value}${ex.unit}`;

          if (setObj.done) {
            // Выполненная ячейка: число остается читаемым, поверх — четкая зеленая галочка
            cell.className =
              'relative min-w-[48px] h-12 px-2 rounded-xl border border-emerald-500/45 bg-emerald-500/10 dark:bg-emerald-500/15 flex items-center justify-center active:scale-95 transition-all select-none overflow-hidden';
            cell.innerHTML = `
              <span class="text-sm font-semibold tabular-nums text-emerald-950/70 dark:text-emerald-100/80 z-0">${displayVal}</span>
              <svg class="absolute inset-0 w-7 h-7 m-auto text-emerald-500/75 dark:text-emerald-400/75 pointer-events-none z-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
              </svg>
            `;
          } else {
            // Невыполненная ячейка: показывает целевое количество повторов/секунд
            cell.className =
              'relative min-w-[48px] h-12 px-2 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-950 text-zinc-700 dark:text-zinc-200 hover:border-zinc-400 dark:hover:border-zinc-600 flex items-center justify-center active:scale-95 transition-all select-none';
            cell.innerHTML = `
              <span class="text-sm font-semibold tabular-nums">${displayVal}</span>
            `;
          }

          cell.addEventListener('click', () => {
            if (!setObj.done) {
              // 1-й тап — отмечаем подход выполненным
              setObj.done = true;
              if (!setObj.value || setObj.value <= 0) {
                setObj.value = ex.target;
              }
              saveToStorage(STORAGE_KEY_WEEK, weekState);
              renderAll();
            } else {
              // 2-й тап — открываем редактор числа и снятия отметки
              openSetModal(dayPlan.key, ex, sIdx);
            }
          });

          setsWrap.appendChild(cell);
        });

        // Кнопка добавления дополнительного подхода «+»
        const addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.title = 'Добавить подход';
        addBtn.className =
          'w-12 h-12 rounded-xl border border-dashed border-zinc-300 dark:border-zinc-700 text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:border-zinc-500 flex items-center justify-center text-base active:scale-95 transition-all';
        addBtn.textContent = '+';
        addBtn.addEventListener('click', () => {
          sets.push({ done: false, value: ex.target });
          saveToStorage(STORAGE_KEY_WEEK, weekState);
          renderAll();
        });
        setsWrap.appendChild(addBtn);

        card.appendChild(setsWrap);
        elExercisesContainer.appendChild(card);
      });
    }

    /**
     * ============================================================
     * МОДАЛЬНОЕ ОКНО РЕДАКТИРОВАНИЯ ПОДХОДА
     * ============================================================
     */
    function openSetModal(dayKey, ex, setIdx) {
      editingTarget = { dayKey, ex, setIdx };
      const setObj = weekState[dayKey].exercises[ex.id][setIdx];

      elModalExName.textContent = ex.name;
      elModalSetLabel.textContent = `Подход ${setIdx + 1} · цель ${ex.target}${ex.unit}`;
      elModalValueInput.value = setObj.value;
      elModalUnitLabel.textContent = ex.unitFull || 'повторений';

      elSetModal.classList.remove('hidden');
      elSetModal.classList.add('flex');
    }

    function closeSetModal() {
      editingTarget = null;
      elSetModal.classList.add('hidden');
      elSetModal.classList.remove('flex');
    }

    document.getElementById('modal-close-btn').addEventListener('click', closeSetModal);
    elSetModal.addEventListener('click', (e) => {
      if (e.target === elSetModal) closeSetModal();
    });

    document.getElementById('modal-minus-btn').addEventListener('click', () => {
      const cur = Number(elModalValueInput.value) || 0;
      elModalValueInput.value = Math.max(0, cur - 1);
    });

    document.getElementById('modal-plus-btn').addEventListener('click', () => {
      const cur = Number(elModalValueInput.value) || 0;
      elModalValueInput.value = Math.min(999, cur + 1);
    });

    document.getElementById('modal-save-btn').addEventListener('click', () => {
      if (!editingTarget) return;
      const { dayKey, ex, setIdx } = editingTarget;
      const val = Math.max(0, Math.min(999, parseInt(elModalValueInput.value, 10) || 0));
      weekState[dayKey].exercises[ex.id][setIdx].value = val;
      weekState[dayKey].exercises[ex.id][setIdx].done = val > 0;
      saveToStorage(STORAGE_KEY_WEEK, weekState);
      closeSetModal();
      renderAll();
    });

    document.getElementById('modal-uncheck-btn').addEventListener('click', () => {
      if (!editingTarget) return;
      const { dayKey, ex, setIdx } = editingTarget;
      weekState[dayKey].exercises[ex.id][setIdx].done = false;
      saveToStorage(STORAGE_KEY_WEEK, weekState);
      closeSetModal();
      renderAll();
    });

    /**
     * ============================================================
     * ГЕНЕРАЦИЯ И ЭКСПОРТ НЕДЕЛЬНОГО ОТЧЕТА
     * ============================================================
     */
    function buildWeeklyMarkdownReport() {
      const monDate = getDateForDayIndex(0);
      const sunDate = getDateForDayIndex(6);
      const { pullups, dips, closedDays } = calculateWeeklyTotals();

      const lines = [];
      lines.push(`# Отчет за неделю (${formatDotDate(monDate)} – ${formatDotDate(sunDate)})`);
      lines.push('');
      lines.push(`- **Подтягивания:** ${pullups}`);
      lines.push(`- **Брусья:** ${dips}`);
      lines.push(`- **Закрыто дней:** ${closedDays} / 7`);
      lines.push('');

      WORKOUT_PLAN.forEach((day, idx) => {
        const dStr = formatDotDate(getDateForDayIndex(idx));
        const status = getDayStatus(day);

        if (day.isRestDay) {
          lines.push(`**${day.short} (${dStr}) — ${day.focus}:** ${weekState[day.key].restDone ? 'выполнено' : 'не отмечено'}`);
          return;
        }

        const statusMark = status === 'done' ? '✓' : status === 'partial' ? 'частично' : 'пропущено';
        lines.push(`**${day.short} (${dStr}) — ${day.focus}** [${statusMark}]`);

        day.exercises.forEach((ex) => {
          const sets = weekState[day.key].exercises[ex.id] || [];
          const doneSets = sets.filter((s) => s.done);

          if (doneSets.length === 0) {
            lines.push(`- ${ex.name}: — (пропущено)`);
          } else {
            const valsList = doneSets.map((s) => `${s.value}${ex.unit}`).join(', ');
            const sum = doneSets.reduce((acc, s) => acc + (Number(s.value) || 0), 0);
            const partialNote = doneSets.length < sets.length ? `, ${doneSets.length}/${sets.length} подх.` : '';
            lines.push(`- ${ex.name}: ${valsList} (итого ${sum}${ex.unit}${partialNote})`);
          }
        });
        lines.push('');
      });

      return lines.join('\n').trim();
    }

    function openExportModal() {
      elExportTextarea.value = buildWeeklyMarkdownReport();
      elExportCopyLabel.textContent = 'Скопировать отчет';
      elExportModal.classList.remove('hidden');
      elExportModal.classList.add('flex');
    }

    function closeExportModal() {
      elExportModal.classList.add('hidden');
      elExportModal.classList.remove('flex');
    }

    document.getElementById('open-export-btn').addEventListener('click', openExportModal);
    document.getElementById('export-close-btn').addEventListener('click', closeExportModal);
    elExportModal.addEventListener('click', (e) => {
      if (e.target === elExportModal) closeExportModal();
    });

    // Копирование отчета (надежный метод через textarea + execCommand для работы внутри iframe)
    document.getElementById('export-copy-btn').addEventListener('click', () => {
      try {
        elExportTextarea.focus();
        elExportTextarea.select();
        elExportTextarea.setSelectionRange(0, elExportTextarea.value.length);
        const ok = document.execCommand('copy');
        if (ok) {
          elExportCopyLabel.textContent = 'Скопировано!';
          showToast('Отчет скопирован в буфер');
          setTimeout(() => {
            elExportCopyLabel.textContent = 'Скопировать отчет';
          }, 2000);
          return;
        }
      } catch (e) {
        // Fallback ниже
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(elExportTextarea.value).then(() => {
          elExportCopyLabel.textContent = 'Скопировано!';
          showToast('Отчет скопирован в буфер');
          setTimeout(() => {
            elExportCopyLabel.textContent = 'Скопировать отчет';
          }, 2000);
        });
      } else {
        showToast('Выдели текст и скопируй вручную');
      }
    });

    // Скачивание .md файла
    document.getElementById('export-download-btn').addEventListener('click', () => {
      const content = elExportTextarea.value;
      const monStr = formatDotDate(getDateForDayIndex(0));
      const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `workout-week-${monStr}.md`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Файл .md скачан');
    });

    /**
     * ============================================================
     * СБРОС НЕДЕЛИ (ИНЛАЙН-ПОДТВЕРЖДЕНИЕ БЕЗ confirm)
     * ============================================================
     */
    function renderResetWeekControl() {
      elResetWeekZone.innerHTML = `
        <button
          id="new-week-btn"
          type="button"
          class="px-3 py-1.5 text-xs font-medium rounded-xl border border-zinc-200 dark:border-zinc-800 text-zinc-600 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-800 active:scale-95 transition-all"
        >
          Новая неделя
        </button>
      `;

      document.getElementById('new-week-btn').addEventListener('click', () => {
        elResetWeekZone.innerHTML = `
          <span class="text-xs text-zinc-500">Сбросить все отметки?</span>
          <button id="confirm-reset-btn" type="button" class="px-2.5 py-1.5 text-xs font-medium rounded-xl bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 active:scale-95 transition-all">Да</button>
          <button id="cancel-reset-btn" type="button" class="px-2.5 py-1.5 text-xs font-medium rounded-xl border border-zinc-200 dark:border-zinc-800 text-zinc-600 dark:text-zinc-300 active:scale-95 transition-all">Нет</button>
        `;

        document.getElementById('confirm-reset-btn').addEventListener('click', () => {
          weekState = createInitialWeekState();
          saveToStorage(STORAGE_KEY_WEEK, weekState);
          renderResetWeekControl();
          renderAll();
          showToast('Начата новая неделя');
        });

        document.getElementById('cancel-reset-btn').addEventListener('click', () => {
          renderResetWeekControl();
        });
      });
    }

    /**
     * ============================================================
     * ОБЩИЙ РЕНДЕР И СТАРТ
     * ============================================================
     */
    function renderAll() {
      updateWeeklyStats();
      renderDaySelector();
      renderExercises();
    }

    function init() {
      initTheme();

      const now = new Date();
      elHeaderDate.textContent = now.toLocaleDateString('ru-RU', {
        weekday: 'long',
        day: 'numeric',
        month: 'long',
      });

      renderResetWeekControl();
      renderAll();
    }

    init();
  </script>
</body>
</html>
