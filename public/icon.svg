<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#08090d" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="4" />

  <!-- Dumbbell / Lightning Motif -->
  <g filter="url(#neonGlow)">
    <!-- Central Bar -->
    <rect x="140" y="240" width="232" height="32" rx="16" fill="url(#glowGrad)" />
    
    <!-- Left Weight Plates -->
    <rect x="96" y="156" width="44" height="200" rx="20" fill="url(#glowGrad)" />
    <rect x="64" y="196" width="32" height="120" rx="16" fill="url(#glowGrad)" opacity="0.8" />
    
    <!-- Right Weight Plates -->
    <rect x="372" y="156" width="44" height="200" rx="20" fill="url(#glowGrad)" />
    <rect x="416" y="196" width="32" height="120" rx="16" fill="url(#glowGrad)" opacity="0.8" />

    <!-- Lightning Accent in Center -->
    <path d="M266 180 L236 250 L276 250 L246 332 L286 242 L252 242 Z" fill="#ffffff" />
  </g>
</svg>
